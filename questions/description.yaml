# The core of the tool: two things Clef judges well from a CVE description alone.
#   1. Does the description establish a security impact? (CNA Rules 4.1.2, 5.2.1)
#   2. How clear and useful is the description for a defender? (CNA Rules 5.1.1-5.1.7, 5.2)
# desc_is_commit_message moved to experimental: Flash flags ordinary GitHub/Apple advisories as commit messages,
# and impact_basis = bug_fix_only already captures fix-log descriptions.
# Judged from the title + description only. Run on the full corpus with Clef Flash.
pack: description
state: description_only
questions:
  security_impact_stated:
    type: noul
    instructions: >-
      Does the description establish a security impact, that is, explain or clearly imply how an attacker could gain
      access, capabilities, or information they are not authorized for, or deny service to others? Judge only what
      the text says; do not assume an impact the text does not support.
    criteria:
      "false": >-
        No security impact is established: it describes a bug, a code change, or a fix (for example a leak, a
        race, a missing check, a NULL dereference) without saying what an attacker could achieve or who could
        trigger it.
      "true": >-
        A security impact is stated or clearly implied, for example remote code execution, privilege escalation,
        reading or modifying data, authentication bypass, cross-site scripting, or denial of service by an attacker.

  impact_basis:
    type: choice
    instructions: How does the description support (or fail to support) a security impact?
    criteria:
      stated_explicitly: It explicitly states what an attacker can do, such as execute code, read files, or crash the service.
      implied_by_weakness: It names a well-known vulnerability class whose impact is implied, such as SQL injection or XSS, without spelling out the impact.
      bug_fix_only: It describes a code defect or its fix, such as a leak, race, or missing check, without saying what an attacker could achieve.
      not_security_relevant: It describes a functional, performance, or reliability problem with no security angle.
      insufficient_information: Too little information to tell what the issue is.

  desc_clarity:
    type: score
    instructions: >-
      Rate how clear, specific, and useful the description is for a defender deciding whether they are affected
      and how serious the issue is.
    criteria:
      - Unusable. Placeholder, nonsense, or no meaningful information about the vulnerability.
      - Poor. Vague or confusing; a defender cannot tell what is affected or what the risk is.
      - Adequate. Identifies the product and the problem but omits important details such as versions, attacker, or impact.
      - Good. Clear product, versions, vulnerability type, attacker, and impact, with minor gaps.
      - Excellent. Precise and complete; product, versions, component, vulnerability type, attacker, preconditions, and impact.
